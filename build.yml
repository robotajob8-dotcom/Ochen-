name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:          # кнопка запуска вручную на сайте

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Установить компоненты Android SDK
        run: |
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" || true

      - name: Скачать Gradle и собрать APK
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          chmod +x gradle-8.4/bin/gradle
          gradle-8.4/bin/gradle assembleDebug --no-daemon
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: Загрузить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: PhoneGuard
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
